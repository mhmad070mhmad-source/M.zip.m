name: Build SAAD DATA APK

'on':
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Find and extract project ZIP
    shell: bash
    run: |
      set -eu

      ZIP_FILE="SAAD_DATA_Professional_APK_GitHub.zip"

      if [ ! -f "$ZIP_FILE" ]; then
        echo "ERROR: Project ZIP not found: $ZIP_FILE"
        echo "Files in repository:"
        ls -la
        exit 1
      fi

      mkdir -p extracted_project
      unzip -o "$ZIP_FILE" -d extracted_project

  - name: Locate Android project
    shell: bash
    run: |
      set -eu

      SETTINGS_FILE="$(find extracted_project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

      if [ -z "$SETTINGS_FILE" ]; then
        echo "ERROR: settings.gradle was not found."
        exit 1
      fi

      PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      echo "Android project found at: $PROJECT_DIR"
      ls -la "$PROJECT_DIR"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build APK
    shell: bash
    run: |
      set -eu

      cd "$PROJECT_DIR"

      gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: SAAD-DATA-APK
      path: extracted_project/**/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14

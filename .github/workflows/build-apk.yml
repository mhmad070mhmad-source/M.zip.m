name: SAAD DATA - Build APK

'on':
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Extract Project and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Find and Extract Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in the repository."
            echo "Upload your SAAD DATA project ZIP to the repository root."
            exit 1
          fi

          echo "Found project archive: $ZIP_FILE"

          mkdir -p extracted_project
          unzip -o "$ZIP_FILE" -d extracted_project

          echo "Archive extracted successfully."

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          GRADLE_FILE=$(find extracted_project \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts."
            echo "The ZIP may not contain a complete Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at: $PROJECT_DIR"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "ERROR: gradlew was not found in the Android project."
            echo "The project ZIP may be incomplete."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAAD-DATA-APK
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

{
  "name": "Build SAAD DATA APK",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": ["main"]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Set up Java",
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "name": "Extract project ZIP",
          "shell": "bash",
          "run": "set -eu\nZIP_FILE=\"$GITHUB_WORKSPACE/SAAD_DATA_Professional_APK_GitHub.zip\"\nif [ ! -f \"$ZIP_FILE\" ]; then echo 'ERROR: Project ZIP not found'; ls -la; exit 1; fi\nmkdir -p \"$GITHUB_WORKSPACE/extracted_project\"\nunzip -o \"$ZIP_FILE\" -d \"$GITHUB_WORKSPACE/extracted_project\"\necho 'ZIP extracted successfully.'"
        },
        {
          "name": "Locate Android project",
          "shell": "bash",
          "run": "set -eu\nSETTINGS=$(find \"$GITHUB_WORKSPACE/extracted_project\" -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -print -quit)\nif [ -z \"$SETTINGS\" ]; then echo 'ERROR: settings.gradle was not found in the ZIP'; find \"$GITHUB_WORKSPACE/extracted_project\" -maxdepth 4 -type f | head -n 80; exit 1; fi\nPROJECT_DIR=$(dirname \"$SETTINGS\")\necho \"PROJECT_DIR=$PROJECT_DIR\" >> \"$GITHUB_ENV\"\necho \"Project found: $PROJECT_DIR\""
        },
        {
          "name": "Install Gradle",
          "uses": "gradle/actions/setup-gradle@v4",
          "with": {
            "gradle-version": "8.9"
          }
        },
        {
          "name": "Build APK",
          "shell": "bash",
          "run": "set -eu\ncd \"$PROJECT_DIR\"\ngradle --no-daemon assembleDebug"
        },
        {
          "name": "Upload APK",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "SAAD-DATA-APK",
            "path": "extracted_project/**/build/outputs/apk/debug/*.apk",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
